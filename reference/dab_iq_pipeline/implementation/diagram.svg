<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <style>
    .box { fill:#f8f9fa; stroke:#2b6cb0; stroke-width:2px; rx:6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#0b2a66 }
    .arrow { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Nodes -->
  <rect x="40"  y="40"  width="200" height="50" class="box"/>
  <text x="140" y="70" text-anchor="middle" class="text">IQ samples</text>

  <rect x="300" y="30" width="220" height="70" class="box"/>
  <text x="410" y="55" text-anchor="middle" class="text">OFDM demodulator</text>
  <text x="410" y="73" text-anchor="middle" class="text">(null / PRS / FFT)</text>

  <rect x="560" y="30" width="200" height="70" class="box"/>
  <text x="660" y="55" text-anchor="middle" class="text">DQPSK demap</text>
  <text x="660" y="73" text-anchor="middle" class="text">(soft metrics)</text>

  <rect x="300" y="140" width="220" height="60" class="box"/>
  <text x="410" y="170" text-anchor="middle" class="text">Viterbi decode</text>
  <text x="410" y="188" text-anchor="middle" class="text">(viterbi_bit_t frame)</text>

  <rect x="560" y="140" width="200" height="60" class="box"/>
  <text x="660" y="170" text-anchor="middle" class="text">Frame split</text>
  <text x="660" y="188" text-anchor="middle" class="text">(FIC | MSC)</text>

  <rect x="40"  y="260" width="220" height="60" class="box"/>
  <text x="150" y="290" text-anchor="middle" class="text">FIC_Decoder</text>
  <text x="150" y="308" text-anchor="middle" class="text">(Viterbi + descramble + CRC)</text>

  <rect x="300" y="260" width="240" height="60" class="box"/>
  <text x="420" y="290" text-anchor="middle" class="text">FIG_Processor</text>
  <text x="420" y="308" text-anchor="middle" class="text">(parse FIGs)</text>

  <rect x="580" y="260" width="220" height="60" class="box"/>
  <text x="690" y="290" text-anchor="middle" class="text">Radio_FIG_Handler</text>
  <text x="690" y="308" text-anchor="middle" class="text">(updates DB)</text>

  <rect x="40"  y="380" width="240" height="70" class="box"/>
  <text x="160" y="410" text-anchor="middle" class="text">MSC Runners</text>
  <text x="160" y="428" text-anchor="middle" class="text">(per-subchannel)</text>

  <rect x="340" y="380" width="240" height="70" class="box"/>
  <text x="460" y="410" text-anchor="middle" class="text">Audio decoders</text>
  <text x="460" y="428" text-anchor="middle" class="text">(DAB / DAB+ / MOT)</text>

  <rect x="640" y="380" width="200" height="70" class="box"/>
  <text x="740" y="410" text-anchor="middle" class="text">GUI / Playback</text>
  <text x="740" y="428" text-anchor="middle" class="text">(audio + slideshow)</text>

  <!-- Arrows -->
  <path d="M240 65 L300 65" class="arrow"/>
  <path d="M520 65 L560 65" class="arrow"/>
  <path d="M660 100 L410 140" class="arrow"/>
  <path d="M660 160 L660 200" class="arrow"/>
  <path d="M660 200 L540 200" class="arrow"/>

  <path d="M400 200 L400 260" class="arrow"/>

  <path d="M220 290 L300 290" class="arrow"/>
  <path d="M540 290 L580 290" class="arrow"/>

  <path d="M420 320 L420 380" class="arrow"/>

  <path d="M280 415 L340 415" class="arrow"/>
  <path d="M580 415 L640 415" class="arrow"/>

  <path d="M720 325 L720 360" class="arrow"/>
  <path d="M760 435 L760 450" class="arrow"/>

  <!-- Cross-links -->
  <path d="M700 290 L700 380" class="arrow"/>
  <path d="M480 260 L480 380" class="arrow"/>

</svg>
